name: WaddleOS build

# Builds the X4 Pro firmware for pull requests into waddle (check only) and on
# every push to waddle, which also publishes it to the "waddle-latest" pre-release:
#   https://github.com/ArneeMe/waddleos/releases/download/waddle-latest/waddleos-x4pro.bin

on:
  push:
    branches: [waddle]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [waddle]
  workflow_dispatch:

concurrency:
  group: waddle-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PIO_ENV: x4pro-waddle
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      # Toolchain, platform and library downloads. Saves about 100 s.
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      # Object files from the last build. SCons compares file contents, so
      # unchanged sources are not compiled again.
      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: .pio
          key: build-${{ env.PIO_ENV }}-${{ hashFiles('platformio.ini') }}-${{ github.sha }}
          restore-keys: build-${{ env.PIO_ENV }}-${{ hashFiles('platformio.ini') }}-

      # Same toolchain setup as release.yml.
      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          pio pkg install -e "$PIO_ENV"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"

      - name: Build
        run: pio run -e "$PIO_ENV" -j"$(nproc)"

      - name: Publish to waddle-latest
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp ".pio/build/$PIO_ENV/firmware.bin" waddleos-x4pro.bin
          sha=$(git rev-parse --short=7 HEAD)
          notes="Built from ${sha}: $(git log -1 --format=%s)"
          if gh release view waddle-latest >/dev/null 2>&1; then
            gh release edit waddle-latest --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release create waddle-latest --prerelease --title "WaddleOS latest" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload waddle-latest waddleos-x4pro.bin --clobber

      - name: Copy firmware
        run: cp ".pio/build/$PIO_ENV/firmware.bin" waddleos-x4pro.bin

      - uses: actions/upload-artifact@v6
        with:
          name: waddleos-x4pro
          path: waddleos-x4pro.bin
          retention-days: 14
